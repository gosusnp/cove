services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: cove
      POSTGRES_PASSWORD: covedev
      POSTGRES_DB: cove
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    configs:
      - source: postgres_dev_init
        target: /docker-entrypoint-initdb.d/01_roles.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cove -d cove"]
      interval: 5s
      timeout: 5s
      retries: 5

  hatchet-lite:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-lite:latest
    environment:
      DATABASE_URL: "postgresql://hatchet:hatchetdev@postgres:5432/hatchet?sslmode=disable"
      SERVER_AUTH_COOKIE_DOMAIN: localhost
      SERVER_AUTH_COOKIE_INSECURE: "t"
      SERVER_GRPC_BIND_ADDRESS: "0.0.0.0"
      SERVER_GRPC_INSECURE: "t"
      SERVER_GRPC_BROADCAST_ADDRESS: localhost:7077
      SERVER_GRPC_PORT: "7077"
      SERVER_URL: http://localhost:8888
      SERVER_AUTH_SET_EMAIL_VERIFIED: "t"
      SERVER_DEFAULT_ENGINE_VERSION: "V1"
      SERVER_INTERNAL_CLIENT_INTERNAL_GRPC_BROADCAST_ADDRESS: localhost:7077
    ports:
      - "8888:8888"
      - "7077:7077"
    volumes:
      - hatchet_lite_config:/config
    depends_on:
      postgres:
        condition: service_healthy

configs:
  postgres_dev_init:
    content: |
      -- Mirrors the production user split in local dev.
      -- cove (POSTGRES_USER) is used for migrations via MIGRATION_DATABASE_URL.
      -- cove_app is the restricted login user used by the app via DATABASE_URL.
      -- cove_app_role holds all runtime permissions; granted by db.Migrate().
      CREATE ROLE cove_app_role;
      CREATE ROLE cove_app WITH LOGIN PASSWORD 'coveapp';
      GRANT cove_app_role TO cove_app;
      -- Hatchet Lite uses its own database on the same Postgres instance.
      CREATE ROLE hatchet WITH LOGIN PASSWORD 'hatchetdev';
      CREATE DATABASE hatchet OWNER hatchet;

volumes:
  postgres_data:
  hatchet_lite_config:
