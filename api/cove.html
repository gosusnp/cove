<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cove</title>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; color: #1a1a1a; background: #f5f5f5; }

/* Header */
.header {
  background: #fff;
  border-bottom: 1px solid #e0e0e0;
  padding: 0 24px;
  display: flex;
  align-items: center;
  gap: 20px;
  height: 48px;
  position: sticky;
  top: 0;
  z-index: 10;
}
.header h1 { font-size: 15px; font-weight: 700; letter-spacing: -0.3px; }
nav { display: flex; }
nav button {
  padding: 0 14px;
  height: 48px;
  border: none;
  background: none;
  cursor: pointer;
  font-size: 13px;
  color: #666;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  transition: color 0.1s;
}
nav button.active { color: #1a1a1a; border-bottom-color: #1a1a1a; font-weight: 500; }
nav button:hover:not(.active) { color: #333; }
.config-btn {
  margin-left: auto;
  padding: 5px 10px;
  font-size: 12px;
  background: none;
  border: 1px solid #e0e0e0;
  border-radius: 4px;
  cursor: pointer;
  color: #666;
}
.config-btn:hover { border-color: #aaa; color: #333; }

/* Main */
.main { padding: 24px; max-width: 960px; margin: 0 auto; }

/* Section header */
.section-header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
.section-header h2 { font-size: 15px; font-weight: 600; }
.back-btn { background: none; border: none; cursor: pointer; color: #666; font-size: 13px; padding: 0; }
.back-btn:hover { color: #1a1a1a; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 5px 12px; border-radius: 4px; border: 1px solid transparent;
  cursor: pointer; font-size: 13px; font-weight: 500; font-family: inherit;
  transition: background 0.1s, border-color 0.1s;
}
.btn-primary { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
.btn-primary:hover { background: #333; }
.btn-secondary { background: #fff; color: #333; border-color: #d0d0d0; }
.btn-secondary:hover { border-color: #999; }
.btn-sm { padding: 3px 10px; font-size: 12px; }
.btn-link { background: none; border: none; cursor: pointer; font-family: inherit; font-size: 12px; padding: 3px 6px; }
.btn-link.edit { color: #0055cc; }
.btn-link.edit:hover { text-decoration: underline; }
.btn-link.danger { color: #b00; }
.btn-link.danger:hover { text-decoration: underline; }

/* Tables */
table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid #e0e0e0; border-radius: 6px; overflow: hidden; }
th {
  text-align: left; padding: 9px 14px; font-size: 11px; font-weight: 600;
  color: #666; text-transform: uppercase; letter-spacing: 0.4px;
  background: #fafafa; border-bottom: 1px solid #e8e8e8;
}
td { padding: 9px 14px; border-bottom: 1px solid #f0f0f0; vertical-align: middle; }
tr:last-child td { border-bottom: none; }
tbody tr:hover td { background: #fafafa; }
.actions-cell { white-space: nowrap; width: 90px; }

/* Program list */
.program-list { display: flex; flex-direction: column; gap: 6px; }
.program-card {
  background: #fff; border: 1px solid #e0e0e0; border-radius: 6px;
  padding: 12px 16px; display: flex; align-items: center; cursor: pointer;
  transition: border-color 0.1s;
}
.program-card:hover { border-color: #bbb; }
.program-card-name { font-weight: 500; flex: 1; font-size: 14px; }
.program-card-actions { display: flex; gap: 2px; }

/* Set cards */
.set-card { background: #fff; border: 1px solid #e0e0e0; border-radius: 6px; margin-bottom: 10px; overflow: hidden; }
.set-header {
  padding: 11px 16px; background: #fafafa; border-bottom: 1px solid #e8e8e8;
  display: flex; align-items: center; gap: 8px;
}
.set-title { font-weight: 600; font-size: 14px; flex: 1; }
.set-meta { font-size: 12px; color: #666; }
.set-exercises table { border: none; border-radius: 0; }
.set-exercises th { background: #fff; padding: 7px 14px; }
.set-exercises td { padding: 7px 14px; }
.set-footer { padding: 8px 14px; border-top: 1px solid #f0f0f0; background: #fafafa; }

/* Modals */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.25);
  display: flex; align-items: center; justify-content: center; z-index: 50;
}
.modal {
  background: #fff; border-radius: 8px; padding: 22px 24px;
  width: 440px; max-width: 92vw;
  box-shadow: 0 8px 32px rgba(0,0,0,0.14);
}
.modal h3 { font-size: 14px; font-weight: 600; margin-bottom: 16px; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }

/* Forms */
.form-group { margin-bottom: 12px; }
.form-group:last-child { margin-bottom: 0; }
label { display: block; font-size: 11px; font-weight: 600; color: #555; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.3px; }
input[type=text], input[type=password], input[type=number], select {
  width: 100%; padding: 7px 9px; border: 1px solid #d0d0d0; border-radius: 4px;
  font-size: 13px; font-family: inherit; background: #fff; color: #1a1a1a;
}
input:focus, select:focus { outline: none; border-color: #555; box-shadow: 0 0 0 2px rgba(0,0,0,0.06); }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-hint { font-size: 11px; color: #888; margin-top: 3px; }

/* Empty / misc */
.empty { color: #999; font-size: 13px; padding: 24px; text-align: center; }
.spacer { flex: 1; }

/* Toast */
.toast {
  position: fixed; bottom: 20px; right: 20px;
  background: #1a1a1a; color: #fff; padding: 10px 14px;
  border-radius: 6px; font-size: 13px; z-index: 200;
  max-width: 380px;
}
.toast.error { background: #a00; }

/* Weight tags */
.tag-bw { color: #666; font-size: 12px; }
.tag-added { color: #1a6e1a; font-size: 12px; font-weight: 500; }
.tag-assisted { color: #0055aa; font-size: 12px; font-weight: 500; }
</style>
</head>
<body x-data="app()" x-init="init()">

<!-- Toast -->
<div x-show="toast.msg" x-transition style="display:none" :class="['toast', toast.type]" x-text="toast.msg"></div>

<!-- Config Modal -->
<div x-show="showConfig" class="modal-overlay" style="display:none" @keydown.escape.window="if(config.apiKey) showConfig=false">
  <div class="modal" @click.stop>
    <h3>API Configuration</h3>
    <div class="form-group">
      <label>Base URL</label>
      <input type="text" x-model="configForm.baseUrl" placeholder="leave blank for same origin" x-ref="configUrl" />
    </div>
    <div class="form-group">
      <label>API Key</label>
      <input type="password" x-model="configForm.apiKey" placeholder="your-api-key" @keydown.enter="saveConfig()" />
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" @click="if(config.apiKey) showConfig=false" x-show="config.apiKey">Cancel</button>
      <button class="btn btn-primary" @click="saveConfig()">Save & Connect</button>
    </div>
  </div>
</div>

<!-- Exercise Modal -->
<div x-show="showExerciseModal" class="modal-overlay" style="display:none" @keydown.escape.window="showExerciseModal=false">
  <div class="modal" @click.stop>
    <h3 x-text="editingExercise ? 'Edit Exercise' : 'New Exercise'"></h3>
    <div class="form-group">
      <label>Name</label>
      <input type="text" x-model="exerciseForm.name" x-ref="exName" @keydown.enter="saveExercise()" />
    </div>
    <div class="form-group">
      <label>Progression <span style="font-weight:400;text-transform:none">(optional)</span></label>
      <input type="text" x-model="exerciseForm.progression" placeholder="e.g. linear, wave load" @keydown.enter="saveExercise()" />
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" @click="showExerciseModal=false">Cancel</button>
      <button class="btn btn-primary" @click="saveExercise()">Save</button>
    </div>
  </div>
</div>

<!-- Program Modal -->
<div x-show="showProgramModal" class="modal-overlay" style="display:none" @keydown.escape.window="showProgramModal=false">
  <div class="modal" @click.stop>
    <h3 x-text="editingProgram ? 'Edit Program' : 'New Program'"></h3>
    <div class="form-group">
      <label>Name</label>
      <input type="text" x-model="programForm.name" x-ref="progName" @keydown.enter="saveProgram()" />
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" @click="showProgramModal=false">Cancel</button>
      <button class="btn btn-primary" @click="saveProgram()">Save</button>
    </div>
  </div>
</div>

<!-- Set Modal -->
<div x-show="showSetModal" class="modal-overlay" style="display:none" @keydown.escape.window="showSetModal=false">
  <div class="modal" @click.stop>
    <h3 x-text="editingSet ? 'Edit Set' : 'New Set'"></h3>
    <div class="form-group">
      <label>Name <span style="font-weight:400;text-transform:none">(optional)</span></label>
      <input type="text" x-model="setForm.name" x-ref="setName" placeholder="e.g. A, Superset 1" />
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Rounds</label>
        <input type="number" x-model.number="setForm.rounds" min="1" max="20" />
      </div>
      <div class="form-group">
        <label>Rest between sets (sec)</label>
        <input type="number" x-model.number="setForm.rest_s" min="0" max="600" />
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" @click="showSetModal=false">Cancel</button>
      <button class="btn btn-primary" @click="saveSet()">Save</button>
    </div>
  </div>
</div>

<!-- Program Exercise Modal -->
<div x-show="showPExModal" class="modal-overlay" style="display:none" @keydown.escape.window="showPExModal=false">
  <div class="modal" @click.stop>
    <h3 x-text="editingPEx ? 'Edit Exercise' : 'Add Exercise'"></h3>
    <div class="form-group">
      <label>Exercise</label>
      <select x-model="pexForm.exercise_id">
        <option value="">— select exercise —</option>
        <template x-for="ex in exercisesSorted" :key="ex.id">
          <option :value="ex.id" x-text="ex.name"></option>
        </template>
      </select>
    </div>
    <div class="form-group">
      <label>Laterality <span style="font-weight:400;text-transform:none">(optional)</span></label>
      <select x-model="pexForm.laterality">
        <option value="">— none —</option>
        <option value="bilateral">Bilateral</option>
        <option value="unilateral">Unilateral</option>
        <option value="left">Left</option>
        <option value="right">Right</option>
        <option value="alternating">Alternating</option>
      </select>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Target Reps</label>
        <input type="number" x-model="pexForm.reps" min="1" placeholder="—" />
      </div>
      <div class="form-group">
        <label>Target Duration (sec)</label>
        <input type="number" x-model="pexForm.duration_s" min="1" placeholder="—" />
      </div>
    </div>
    <div class="form-group">
      <label>Target Weight (kg)</label>
      <input type="number" x-model="pexForm.weight_kg" step="0.5" placeholder="0 = bodyweight" />
      <p class="form-hint">Negative = assisted (e.g. -10kg band). Zero or blank = bodyweight. Positive = added weight.</p>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" @click="showPExModal=false">Cancel</button>
      <button class="btn btn-primary" @click="savePEx()">Save</button>
    </div>
  </div>
</div>

<!-- ── Header ── -->
<div class="header">
  <h1>Cove</h1>
  <nav>
    <button :class="{ active: currentTab === 'exercises' }" @click="switchTab('exercises')">Exercises</button>
    <button :class="{ active: currentTab === 'programs' }" @click="switchTab('programs')">Programs</button>
  </nav>
  <button class="config-btn" @click="openConfig()">⚙ Config</button>
</div>

<div class="main">

  <!-- No config -->
  <div x-show="!config.apiKey" style="display:none">
    <div class="empty" style="padding:60px 0">
      <p style="margin-bottom:16px">Configure your API connection to get started.</p>
      <button class="btn btn-primary" @click="openConfig()">Configure API</button>
    </div>
  </div>

  <!-- ── Exercise Library ── -->
  <div x-show="currentTab === 'exercises' && config.apiKey" style="display:none">
    <div class="section-header">
      <h2>Exercises</h2>
      <button class="btn btn-primary btn-sm" @click="openNewExercise()">+ Add</button>
    </div>

    <div x-show="!exercises.length" class="empty">No exercises yet.</div>

    <table x-show="exercises.length">
      <thead>
        <tr>
          <th>Name</th>
          <th>Progression</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        <template x-for="ex in exercisesSorted" :key="ex.id">
          <tr>
            <td x-text="ex.name"></td>
            <td x-text="ex.progression || '—'" style="color:#666"></td>
            <td class="actions-cell">
              <button class="btn-link edit" @click="openEditExercise(ex)">Edit</button>
              <button class="btn-link danger" @click="deleteExercise(ex)">Delete</button>
            </td>
          </tr>
        </template>
      </tbody>
    </table>
  </div>

  <!-- ── Programs List ── -->
  <div x-show="currentTab === 'programs' && view === 'list' && config.apiKey" style="display:none">
    <div class="section-header">
      <h2>Programs</h2>
      <button class="btn btn-primary btn-sm" @click="openNewProgram()">+ New</button>
    </div>

    <div x-show="!programs.length" class="empty">No programs yet.</div>

    <div class="program-list">
      <template x-for="prog in programs" :key="prog.id">
        <div class="program-card" @click="openProgram(prog)">
          <span class="program-card-name" x-text="prog.name"></span>
          <div class="program-card-actions" @click.stop>
            <button class="btn-link edit" @click="openEditProgram(prog)">Edit</button>
            <button class="btn-link danger" @click="deleteProgram(prog)">Delete</button>
          </div>
        </div>
      </template>
    </div>
  </div>

  <!-- ── Program Detail ── -->
  <div x-show="currentTab === 'programs' && view === 'detail' && config.apiKey" style="display:none">
    <div class="section-header">
      <button class="back-btn" @click="view = 'list'">← Programs</button>
      <h2 x-text="currentProgram?.name"></h2>
      <button class="btn btn-secondary btn-sm" @click="openEditProgram(currentProgram)" style="margin-left:4px">Rename</button>
      <span class="spacer"></span>
      <button class="btn btn-primary btn-sm" @click="openNewSet()">+ Add Set</button>
    </div>

    <div x-show="!currentProgram?.sets?.length" class="empty">No sets yet. Add a set to start building this program.</div>

    <template x-for="set in sortedSets()" :key="set.id">
      <div class="set-card">

        <div class="set-header">
          <span class="set-title" x-text="set.name || 'Unnamed Set'"></span>
          <span class="set-meta" x-text="`${set.rounds ?? 1} × `"></span>
          <template x-if="set.rest_s">
            <span class="set-meta" x-text="`${set.rest_s}s rest`"></span>
          </template>
          <span class="spacer"></span>
          <button class="btn-link edit" @click="openEditSet(set)">Edit</button>
          <button class="btn-link danger" @click="deleteSet(set)">Delete</button>
        </div>

        <div class="set-exercises">
          <table x-show="set.exercises?.length">
            <thead>
              <tr>
                <th>Exercise</th>
                <th>Laterality</th>
                <th>Reps</th>
                <th>Duration</th>
                <th>Weight</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              <template x-for="pex in sortedExercises(set)" :key="pex.id">
                <tr>
                  <td x-text="pex.name"></td>
                  <td x-text="pex.laterality || '—'" style="color:#666;font-size:12px"></td>
                  <td x-text="pex.reps ?? '—'"></td>
                  <td x-text="pex.duration_s ? pex.duration_s + 's' : '—'"></td>
                  <td>
                    <span x-show="!pex.weight_kg" class="tag-bw">bodyweight</span>
                    <span x-show="pex.weight_kg > 0" class="tag-added" x-text="'+' + pex.weight_kg + 'kg'"></span>
                    <span x-show="pex.weight_kg < 0" class="tag-assisted" x-text="pex.weight_kg + 'kg (assisted)'"></span>
                  </td>
                  <td class="actions-cell">
                    <button class="btn-link edit" @click="openEditPEx(pex, set)">Edit</button>
                    <button class="btn-link danger" @click="deletePEx(pex, set)">Del</button>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
          <div x-show="!set.exercises?.length" style="padding:10px 16px; color:#aaa; font-size:12px">No exercises in this set.</div>
        </div>

        <div class="set-footer">
          <button class="btn btn-secondary btn-sm" @click="openNewPEx(set)">+ Add Exercise</button>
        </div>
      </div>
    </template>
  </div>

</div>

<script>
function app() {
  return {
    // UI
    currentTab: 'exercises',
    view: 'list',          // 'list' | 'detail'

    // Toast
    toast: { msg: '', type: '' },
    _toastTimer: null,

    // Config
    config: { baseUrl: '', apiKey: '' },
    configForm: { baseUrl: '', apiKey: '' },
    showConfig: false,

    // Data
    exercises: [],
    programs: [],
    currentProgram: null,

    // Exercise modal
    showExerciseModal: false,
    editingExercise: null,
    exerciseForm: { name: '', progression: '' },

    // Program modal
    showProgramModal: false,
    editingProgram: null,
    programForm: { name: '' },

    // Set modal
    showSetModal: false,
    editingSet: null,
    setForm: { name: '', rounds: 3, rest_s: 90 },

    // PEx modal
    showPExModal: false,
    editingPEx: null,
    targetPExSet: null,
    pexForm: { exercise_id: '', laterality: '', reps: '', duration_s: '', weight_kg: '' },

    // ── Computed ────────────────────────────────────────────
    get exercisesSorted() {
      return [...this.exercises].sort((a, b) => a.name.localeCompare(b.name));
    },

    sortedSets() {
      return this.currentProgram?.sets ?? [];
    },

    sortedExercises(set) {
      return set.exercises ?? [];
    },

    // ── Init ────────────────────────────────────────────────
    async init() {
      const saved = localStorage.getItem('cove_config');
      if (saved) {
        try { this.config = JSON.parse(saved); } catch {}
      }
      this.configForm = { ...this.config };
      if (this.config.apiKey) {
        await Promise.all([this.loadExercises(), this.loadPrograms()]);
      } else {
        this.showConfig = true;
      }
    },

    // ── API ─────────────────────────────────────────────────
    async api(method, path, body) {
      const base = this.config.baseUrl.replace(/\/$/, '');
      const res = await fetch(base + '/api' + path, {
        method,
        headers: {
          'Authorization': `Bearer ${this.config.apiKey}`,
          'Content-Type': 'application/json',
        },
        body: body !== undefined ? JSON.stringify(body) : undefined,
      });
      if (!res.ok) {
        const msg = await res.text().catch(() => '');
        throw new Error(`${res.status}: ${msg || res.statusText}`);
      }
      const text = await res.text();
      return text ? JSON.parse(text) : null;
    },

    async run(fn) {
      try {
        return await fn();
      } catch (e) {
        this.showToast(e.message, 'error');
        return null;
      }
    },

    showToast(msg, type = '') {
      this.toast = { msg, type };
      clearTimeout(this._toastTimer);
      this._toastTimer = setTimeout(() => this.toast = { msg: '', type: '' }, 5000);
    },

    // ── Config ──────────────────────────────────────────────
    openConfig() {
      this.configForm = { ...this.config };
      this.showConfig = true;
      this.$nextTick(() => this.$refs.configUrl?.focus());
    },

    async saveConfig() {
      const url = this.configForm.baseUrl.trim().replace(/\/$/, '');
      const key = this.configForm.apiKey.trim();
      if (!key) { this.showToast('API key is required', 'error'); return; }
      this.config = { baseUrl: url, apiKey: key };
      localStorage.setItem('cove_config', JSON.stringify(this.config));
      this.showConfig = false;
      await Promise.all([this.loadExercises(), this.loadPrograms()]);
      this.showToast('Connected');
    },

    // ── Tab ─────────────────────────────────────────────────
    switchTab(tab) {
      this.currentTab = tab;
      if (tab === 'programs') this.view = 'list';
    },

    // ── Exercises ───────────────────────────────────────────
    async loadExercises() {
      const data = await this.run(() => this.api('GET', '/exercises'));
      if (data) this.exercises = data;
    },

    openNewExercise() {
      this.editingExercise = null;
      this.exerciseForm = { name: '', progression: '' };
      this.showExerciseModal = true;
      this.$nextTick(() => this.$refs.exName?.focus());
    },

    openEditExercise(ex) {
      this.editingExercise = ex;
      this.exerciseForm = { name: ex.name, progression: ex.progression ?? '' };
      this.showExerciseModal = true;
      this.$nextTick(() => this.$refs.exName?.focus());
    },

    async saveExercise() {
      if (!this.exerciseForm.name.trim()) { this.showToast('Name is required', 'error'); return; }
      const body = { name: this.exerciseForm.name.trim() };
      if (this.exerciseForm.progression.trim()) body.progression = this.exerciseForm.progression.trim();
      const ok = await this.run(() =>
        this.editingExercise
          ? this.api('PUT', `/exercises/${this.editingExercise.id}`, body)
          : this.api('POST', '/exercises', body)
      );
      if (ok !== null) { this.showExerciseModal = false; await this.loadExercises(); }
    },

    async deleteExercise(ex) {
      if (!confirm(`Delete "${ex.name}"? This may affect programs that use it.`)) return;
      const ok = await this.run(() => this.api('DELETE', `/exercises/${ex.id}`));
      if (ok !== null) await this.loadExercises();
    },

    // ── Programs ────────────────────────────────────────────
    async loadPrograms() {
      const data = await this.run(() => this.api('GET', '/programs'));
      if (data) this.programs = data;
    },

    openNewProgram() {
      this.editingProgram = null;
      this.programForm = { name: '' };
      this.showProgramModal = true;
      this.$nextTick(() => this.$refs.progName?.focus());
    },

    openEditProgram(prog) {
      this.editingProgram = prog;
      this.programForm = { name: prog.name };
      this.showProgramModal = true;
      this.$nextTick(() => this.$refs.progName?.focus());
    },

    async saveProgram() {
      if (!this.programForm.name.trim()) { this.showToast('Name is required', 'error'); return; }
      const body = { name: this.programForm.name.trim() };
      const ok = await this.run(() =>
        this.editingProgram
          ? this.api('PUT', `/programs/${this.editingProgram.id}`, body)
          : this.api('POST', '/programs', body)
      );
      if (ok !== null) {
        if (this.editingProgram && this.currentProgram?.id === this.editingProgram.id) {
          this.currentProgram = { ...this.currentProgram, name: body.name };
        }
        this.showProgramModal = false;
        await this.loadPrograms();
      }
    },

    async deleteProgram(prog) {
      if (!confirm(`Delete program "${prog.name}"?`)) return;
      const ok = await this.run(() => this.api('DELETE', `/programs/${prog.id}`));
      if (ok !== null) await this.loadPrograms();
    },

    async openProgram(prog) {
      this.currentTab = 'programs';
      this.view = 'detail';
      const data = await this.run(() => this.api('GET', `/programs/${prog.id}`));
      if (data) this.currentProgram = data;
    },

    async refreshProgram() {
      if (!this.currentProgram) return;
      const data = await this.run(() => this.api('GET', `/programs/${this.currentProgram.id}`));
      if (data) this.currentProgram = data;
    },

    // ── Sets ────────────────────────────────────────────────
    openNewSet() {
      this.editingSet = null;
      this.setForm = { name: '', rounds: 3, rest_s: 90 };
      this.showSetModal = true;
      this.$nextTick(() => this.$refs.setName?.focus());
    },

    openEditSet(set) {
      this.editingSet = set;
      this.setForm = {
        name: set.name ?? '',
        rounds: set.rounds ?? 3,
        rest_s: set.rest_s ?? 90,
      };
      this.showSetModal = true;
      this.$nextTick(() => this.$refs.setName?.focus());
    },

    async saveSet() {
      const body = {
        name: this.setForm.name.trim() || null,
        rounds: Number(this.setForm.rounds) || 1,
        rest_s: Number(this.setForm.rest_s) || 0,
      };
      const pid = this.currentProgram.id;
      const ok = await this.run(() =>
        this.editingSet
          ? this.api('PUT', `/programs/${pid}/sets/${this.editingSet.id}`, body)
          : this.api('POST', `/programs/${pid}/sets`, {
              ...body,
              sort_order: this.currentProgram?.sets?.length ?? 0,
            })
      );
      if (ok !== null) { this.showSetModal = false; await this.refreshProgram(); }
    },

    async deleteSet(set) {
      if (!confirm(`Delete set "${set.name || 'this set'}" and all its exercises?`)) return;
      const pid = this.currentProgram.id;
      const ok = await this.run(() => this.api('DELETE', `/programs/${pid}/sets/${set.id}`));
      if (ok !== null) await this.refreshProgram();
    },

    // ── Program Exercises ────────────────────────────────────
    openNewPEx(set) {
      this.editingPEx = null;
      this.targetPExSet = set;
      this.pexForm = { exercise_id: '', laterality: '', reps: '', duration_s: '', weight_kg: '' };
      this.showPExModal = true;
    },

    openEditPEx(pex, set) {
      this.editingPEx = pex;
      this.targetPExSet = set;
      this.pexForm = {
        exercise_id: pex.exercise_id ?? '',
        laterality: pex.laterality ?? '',
        reps: pex.reps != null ? String(pex.reps) : '',
        duration_s: pex.duration_s != null ? String(pex.duration_s) : '',
        weight_kg: pex.weight_kg != null ? String(pex.weight_kg) : '',
      };
      this.showPExModal = true;
    },

    async savePEx() {
      if (!this.pexForm.exercise_id) { this.showToast('Select an exercise', 'error'); return; }
      const body = { exercise_id: Number(this.pexForm.exercise_id) };
      if (this.pexForm.laterality) body.laterality = this.pexForm.laterality;
      const tr = this._num(this.pexForm.reps);
      const td = this._num(this.pexForm.duration_s);
      const tw = this._num(this.pexForm.weight_kg);
      if (tr !== null) body.reps = tr;
      if (td !== null) body.duration_s = td;
      if (tw !== null) body.weight_kg = tw;

      const pid = this.currentProgram.id;
      const sid = this.targetPExSet.id;
      const ok = await this.run(() =>
        this.editingPEx
          ? this.api('PUT', `/programs/${pid}/sets/${sid}/exercises/${this.editingPEx.id}`, body)
          : this.api('POST', `/programs/${pid}/sets/${sid}/exercises`, {
              ...body,
              sort_order: this.targetPExSet.exercises?.length ?? 0,
            })
      );
      if (ok !== null) { this.showPExModal = false; await this.refreshProgram(); }
    },

    async deletePEx(pex, set) {
      if (!confirm(`Remove "${pex.name}" from this set?`)) return;
      const pid = this.currentProgram.id;
      const ok = await this.run(() => this.api('DELETE', `/programs/${pid}/sets/${set.id}/exercises/${pex.id}`));
      if (ok !== null) await this.refreshProgram();
    },

    // ── Helpers ─────────────────────────────────────────────
    _num(v) {
      if (v === '' || v === null || v === undefined) return null;
      const n = Number(v);
      return isNaN(n) ? null : n;
    },
  };
}
</script>
</body>
</html>
